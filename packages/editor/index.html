<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121017" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A manual-first logo design studio with approachable tools and precise vector editing."
    />
    <meta property="og:title" content="OpenLogo Studio" />
    <meta
      property="og:description"
      content="A manual-first logo design studio with approachable tools and precise vector editing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://openlogo.invalid/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenLogo Studio" />
    <meta
      name="twitter:description"
      content="A manual-first logo design studio with approachable tools and precise vector editing."
    />
    <meta name="twitter:image" content="https://openlogo.invalid/og.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f6bf5'/%3E%3Cpath d='M18 17h8v23h13v7H18zm23 0h8v30h-8z' fill='white'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="/fonts/Inter-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>OpenLogo Studio</title>
    <script>
      // Theme must be on <html> before the bundle paints anything (no
      // flash). Dark is the default; light applies only when explicitly
      // stored (lib/prefs.ts reads the same key with the same rule).
      (function () {
        var theme = "dark";
        try {
          var prefs = JSON.parse(
            localStorage.getItem("openlogo:prefs") || "{}",
          );
          if (prefs && prefs.theme === "light") {
            theme = "light";
          }
        } catch (error) {
          /* unreadable prefs = default dark */
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", "#17151b");
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
